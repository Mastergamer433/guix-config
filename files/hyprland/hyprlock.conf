general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 96
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    position = 0, -100
    halign = center
    valign = center

    placeholder_text = Password
}